server {
    listen 80;
    listen [::]:80;

    server_name {domain_name};

    # Redirect to HTTPS maintaining original URI
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name {domain_name};

    # Root directory for your static Hugo files
    root /home/username/hugo-directory/public;
    index index.html;

    # SSL Certificate Configuration (Update paths to match your cert location)
    ssl_certificate /etc/letsencrypt/live/{domain_name}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{domain_name}/privkey.pem;

    # Recommended SSL Protocols and Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Hugo static file handling
    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: Cache static assets (images, CSS, JS) for better Hugo performance
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
